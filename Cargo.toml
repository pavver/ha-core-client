[package]
name = "ha-core-client"
version = "0.1.0"
edition = "2024"
description = "A strongly-typed, ergonomic, and resilient asynchronous Rust client for the Home Assistant WebSocket API."
license = "GNU"
repository = "https://github.com/your-username/ha-core-client" # TODO: Replace with your repository URL
readme = "README.md"
keywords = ["home-assistant", "hass", "websocket", "async", "home-automation"]
categories = ["api-bindings", "asynchronous", "network-programming"]

[dependencies]
tokio-tungstenite = { version = "0.28.0", features = ["native-tls"] }
tokio = { version = "1.48.0", features = ["full"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
anyhow = "1.0.100"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.22", features = ["env-filter", "fmt"] }
futures-util = "0.3.31"
chrono = { version = "0.4.42", features = ["serde"] }
log = "0.4.29"
strum = { version = "0.27.2", features = ["derive"] }
humantime-serde = "1.1.1"
